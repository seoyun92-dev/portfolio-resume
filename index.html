<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>서윤.resume</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/widget.css" />
    <link rel="stylesheet" href="css/tour.css" />
  </head>
  <body data-theme="dark">
    <div class="ide-container">
      <!-- 타이틀바 -->
      <header class="title-bar">
        <div class="title-left">
          <button
            id="mobileMenuToggle"
            class="icon-btn mobile-menu-toggle"
            title="탐색기 열기"
            aria-label="탐색기 열기"
          >
            <span class="icon">☰</span>
          </button>
          <span class="title-text">서윤.resume</span>
        </div>
        <div class="title-right">
          <button
            id="themeToggle"
            class="icon-btn"
            title="테마 전환 (Ctrl+Shift+T)"
            aria-label="테마 전환"
          >
            <span class="icon">🌙</span>
          </button>
        </div>
      </header>

      <!-- 메인 컨테이너 -->
      <div class="main-container">
        <!-- 모바일 사이드바 오버레이 (사이드바가 열렸을 때 배경을 덮고, 클릭 시 닫음) -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>

        <!-- 사이드바 (탐색기) -->
        <aside id="sidebar" class="sidebar">
          <div class="sidebar-header">
            <h2 class="sidebar-title">탐색기</h2>
            <button
              id="sidebarToggle"
              class="sidebar-toggle"
              aria-label="탐색기 닫기"
            >
              ✕
            </button>
          </div>
          <nav class="file-tree" id="fileTree"></nav>
        </aside>

        <!-- 에디터 영역 -->
        <section class="editor-area">
          <!-- 탭바 -->
          <div class="tabs" id="tabBar"></div>

          <!-- 에디터 -->
          <div class="editor">
            <div class="editor-view" id="editorView">
              <div class="welcome-message">
                <p>파일을 선택하여 시작하세요</p>
              </div>
            </div>
          </div>

          <!-- 상태바 -->
          <footer class="status-bar">
            <div class="status-left">
              <span id="statusPath" class="status-item">준비 완료</span>
            </div>
            <div class="status-right">
              <span class="status-item">UTF-8</span>
              <span id="statusViewMode" class="status-item">Preview</span>
              <span id="statusLine" class="status-item">행 1, 열 1</span>
            </div>
          </footer>
        </section>
      </div>
    </div>

    <!-- 검색 모달 -->
    <div id="searchModal" class="search-modal hidden">
      <div class="search-container">
        <div class="search-input-wrapper">
          <input
            id="searchInput"
            type="text"
            class="search-input"
            placeholder="파일명과 내용 검색... (Esc로 닫기)"
            autocomplete="off"
          />
        </div>
        <div id="searchResults" class="search-results"></div>
      </div>
    </div>

    <!-- 토스트 컨테이너 -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/widget.js"></script>
    <script src="js/tour.js"></script>
  </body>
</html>
